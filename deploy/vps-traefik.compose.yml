# Compose file for a VPS that already runs Traefik (Hostinger "Ubuntu with n8n"
# template: Traefik owns ports 80/443 on the external network "n8n_default").
# The image is built straight from the public GitHub repo, so this file alone
# is enough for Hostinger's Docker Manager. Secrets come from the project's
# environment variables: APP_TOKEN (required), KITE_API_KEY, KITE_ACCESS_TOKEN.
name: astro-engine
services:
  app:
    build:
      context: https://github.com/captainjacksparrow93/predictionengine.git#claude/wonderful-goldberg-en15qi
    image: astro-engine:latest
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      APP_TOKEN: ${APP_TOKEN:?set APP_TOKEN}
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_ACCESS_TOKEN: ${KITE_ACCESS_TOKEN:-}
      TZ: Asia/Kolkata
    volumes:
      - astro_data:/data
    mem_limit: 2g
    networks:
      - n8n_default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.astro-engine.rule=Host(`astro.srv1275499.hstgr.cloud`)"
      - "traefik.http.routers.astro-engine.entrypoints=websecure"
      - "traefik.http.routers.astro-engine.tls.certresolver=mytlschallenge"
      - "traefik.http.services.astro-engine.loadbalancer.server.port=8000"
volumes:
  astro_data:
networks:
  n8n_default:
    external: true
